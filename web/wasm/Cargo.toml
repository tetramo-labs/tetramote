[package]
name = "tetra_web"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "The browser side of a Tetramote session: iroh over relays, with the core's wire format"

[lib]
crate-type = ["cdylib"]

[dependencies]
tetra_core = { path = "../../core", default-features = false }
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
n0-future = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1"
wasm-tracing = { version = "2", default-features = false }
tracing = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
