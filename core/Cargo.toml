[package]
name = "tetra_core"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "iroh transport shared by the Tetratop Mac host and phone app"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
bytes = "1"
iroh = "1.4.1"
iroh-tickets = "1.0.0"
n0-watcher = "*"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
ndk-context = "0.1"

[[example]]
name = "fakehost"
test = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
