[package]
name = "tetra_core"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "iroh transport shared by the Tetramote Mac host and phone app"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["native"]
native = ["dep:iroh", "dep:iroh-tickets", "dep:n0-watcher", "tokio/rt-multi-thread", "tokio/net", "tokio/macros", "tokio/time"]

[dependencies]
bytes = "1"
iroh = { version = "1.4.1", optional = true }
iroh-tickets = { version = "1.0.0", optional = true }
n0-watcher = { version = "*", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "sync"] }
web-time = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
ndk-context = "0.1"

[[example]]
name = "fakehost"
test = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
