[package]
name = "tetramote-desktop"
version = "0.4.10"
edition = "2021"
publish = false
license = "MIT"
description = "Tetramote for desktops: share this computer or control another over iroh"

[lib]
name = "tetramote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
tauri-plugin-process = "=2.4.0"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-updater = "=2.14.1"
tetra_core = { path = "../../core" }
tetra_media = { path = "../media" }
arboard = { version = "3.6", default-features = false }
base64 = "0.22"
getrandom = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
log = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
