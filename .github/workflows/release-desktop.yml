name: Release desktop

# Started by scripts/release-desktop.sh after it has created the draft release
# and uploaded the macOS build; this adds Windows and Linux to the same release
# and merges their entries into its latest.json.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the draft release targets (its tag only exists once it's published)
        required: true
      release_id:
        description: Id of the draft release to upload to
        required: true
      platforms:
        description: Which builds to run (one, to redo just that one)
        type: choice
        default: all
        options: [all, windows-latest, ubuntu-24.04]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 24.04 because the PipeWire crate needs newer headers than 22.04 ships
        # (so the Linux builds need glibc 2.39+).
        platform: ${{ inputs.platforms == 'all' && fromJSON('["windows-latest", "ubuntu-24.04"]') || fromJSON(format('["{0}"]', inputs.platforms)) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev libasound2-dev pkg-config cmake patchelf
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - name: Frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: desktop
          tauriScript: bunx tauri
          releaseId: ${{ inputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
