<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 655px; height: 1363px; background: transparent; overflow: hidden; }
  .body { position: absolute; left: 6px; top: 2px; width: 643px; height: 1359px; padding: 4px; border-radius: 104px; background: linear-gradient(150deg, #b9bcc4 0%, #6b6e76 14%, #3a3c42 40%, #6f727a 64%, #34363b 84%, #c3c6cd 100%); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7); }
  .glass { width: 100%; height: 100%; padding: 16px; border-radius: 100px; background: #000; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07); }
  .screen { position: relative; width: 603px; height: 1311px; border-radius: 84px; overflow: hidden; background: #171717 url(iphone-app.webp) 0 0 / 603px 1311px no-repeat; }
  .island { position: absolute; left: 50%; top: 18px; width: 190px; height: 56px; margin-left: -95px; border-radius: 28px; background: #000; }
  .button { position: absolute; width: 6px; border-radius: 3px 0 0 3px; background: linear-gradient(90deg, #44464c, #a3a6ae 55%, #5a5d65); }
  .action { left: 0; top: 250px; height: 56px; }
  .volup { left: 0; top: 340px; height: 100px; }
  .voldown { left: 0; top: 460px; height: 100px; }
  .power { right: 0; left: auto; top: 380px; height: 150px; border-radius: 0 3px 3px 0; }
</style>
</head>
<body>
  <div class="button action"></div>
  <div class="button volup"></div>
  <div class="button voldown"></div>
  <div class="button power"></div>
  <div class="body">
    <div class="glass">
      <div class="screen"><div class="island"></div></div>
    </div>
  </div>
</body>
</html>
