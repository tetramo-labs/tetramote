name: Tetratop
options:
  bundleIdPrefix: com.tetramo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: B8446S9493
targets:
  Tetratop:
    type: application
    platform: macOS
    sources:
      - path: Tetratop
    info:
      path: Tetratop/Info.plist
      properties:
        CFBundleDisplayName: Tetratop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://github.com/tetramo-labs/tetratop/releases/latest/download/appcast.xml
        SUPublicEDKey: gC7NzSa8fN3tSLk+IXMQtq06jnERxcmB/2+5eBN1ATM=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
    entitlements:
      path: Tetratop/Tetratop.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_NAME: Tetratop
        PRODUCT_BUNDLE_IDENTIFIER: com.tetramo.tetratop.host
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/../core/include
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/../core/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../core/target/macos
        OTHER_LDFLAGS: -ltetra_core
        DEAD_CODE_STRIPPING: true
        ENABLE_PREVIEWS: false
    dependencies:
      - package: Sparkle
      - sdk: ScreenCaptureKit.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: ServiceManagement.framework
      - sdk: CoreImage.framework
  TetratopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TetratopTests
      - path: Tetratop/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tetramo.tetratop.host.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
schemes:
  Tetratop:
    build:
      targets:
        Tetratop: all
        TetratopTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TetratopTests
